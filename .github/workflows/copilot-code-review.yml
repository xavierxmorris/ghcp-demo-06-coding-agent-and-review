# Optional request automation, not evidence that a review completed.
name: Request Copilot code review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      vars.ENABLE_COPILOT_REVIEW == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
          echo "Review requested. This job does not assert review completion or approval." >> "$GITHUB_STEP_SUMMARY"
